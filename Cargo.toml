[workspace]
members = [
    "crates/common",
    "crates/engine-wds",
    "crates/engine-uds",
    "crates/engine-och",
    "crates/engines",
    "crates/report",
    "crates/sdk",
    "crates/cli",
    "crates/gui",
    "crates/wasm",
]
resolver = "2"

[workspace.package]
version = "11.0.0"
edition = "2021"
rust-version = "1.95"
authors = ["Matthew Downs <matthew@neer.ai>"]
license = "AGPL-3.0-only"
repository = "https://github.com/neeraip/hydra"
homepage = "https://github.com/neeraip/hydra"
documentation = "https://neeraip.github.io/hydra/"


# Optimise the engines even in dev/test builds so that the test suite — and any
# test that exercises a solver — runs at near-release speed without requiring
# `--release`. `profile.dev.package."*"` below does not cover these: it applies
# to dependencies, and a workspace member is not one.
#
# The uds entry was added when a bundled example (a 36-hour dynamic-wave run)
# took 65 seconds unoptimised and under a second with this. Routing is the
# hot loop, and any test that routes pays for its absence.
[profile.dev.package.hydra-engine-wds]
opt-level = 2

[profile.dev.package.hydra-engine-uds]
opt-level = 2

# Optimise all dependencies in dev (serde, tauri IPC, etc.): they rebuild only
# on cold builds or lockfile changes, and unoptimized serialization made the
# dev GUI crawl on large (46k-element) networks.
[profile.dev.package."*"]
opt-level = 2

# Optimise the GUI data plane (DTO conversion, binary snapshot and
# period-result encoding) in dev too. Measured on an M-series laptop:
# incremental rebuilds ~3s at opt-level 2 vs ~1s at 0/1 — worth it for
# near-release IPC speed on 46k-element networks. Drop to 0 temporarily if
# you need clean debugger stepping through hydra-gui.
[profile.dev.package.hydra-gui]
opt-level = 2
codegen-units = 1

[profile.release]
lto = "fat"
codegen-units = 1
