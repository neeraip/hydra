name: Cargo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly safety net: catch toolchain/registry drift during push-quiet weeks.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: cargo-ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only. A cancelled run never reaches its
  # post-job cache save, and release pushes land in quick succession — with
  # unconditional cancellation they repeatedly killed the cache-saving run,
  # leaving every subsequent Windows job a ~20-minute cold build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, formatting, docs, and dependency checks are platform-independent —
  # run them once on Ubuntu rather than repeating them per-OS.
  lint:
    name: Cargo Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          # Restore everywhere, save from main only: the repo cache budget is
          # 10 GB, one saved trio of OS caches is ~4 GB, and PR/merge-ref
          # saves were evicting the main caches every run depends on.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check dependencies (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2.1.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Cargo Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      CARGO_TERM_COLOR: always
      # CI never attaches a debugger: skipping debuginfo roughly halves the
      # cold Windows build (MSVC PDB generation and linking) and shrinks every
      # cache. Backtraces still name frames via debug-assertions panics.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          # Restore everywhere, save from main only: the repo cache budget is
          # 10 GB, one saved trio of OS caches is ~4 GB, and PR/merge-ref
          # saves were evicting the main caches every run depends on.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

  # Forward-compatibility canary: the workspace pins the MSRV toolchain via
  # rust-toolchain.toml, so nothing else exercises the latest stable compiler.
  # Non-blocking — breakage here is an early warning, never a merge blocker.
  test-stable:
    name: Cargo Test / latest stable (non-blocking)
    # Drift canary, not a merge gate (continue-on-error): running it per-PR
    # spends ~9 runner-minutes without adding any PR safety. Main pushes and
    # the weekly schedule keep the early warning.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain (pinned, for rustup)
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false

      - name: Install latest stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: stable
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests (latest stable)
        run: cargo +stable test --workspace --all-targets --locked
