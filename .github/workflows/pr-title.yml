name: PR Title

# The squash commit takes the PR title, and release-please reads versions and
# changelogs from those commits, so the title must be a Conventional Commit.
#
# `pull_request`, not `pull_request_target`: release-please opens and updates
# its release PRs with the workflow token, and GitHub creates no run at all
# for a `pull_request_target` event made with that token, so the required
# check never arrived on a release PR. A `pull_request` run is created and
# waits for a maintainer's approval, like every other check on those PRs.
# This job only reads the title, so a fork PR's read-only token is enough.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Every required check must also report in the merge queue. The title was
  # validated on the pull request; editing it after queueing does not change
  # what lands (the squash takes the title at merge time, and the queue is
  # re-entered if the PR changes), so the queue run only reports success.
  merge_group:

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validated on the pull request
        if: github.event_name == 'merge_group'
        run: echo "The title was validated when the pull request was opened or edited."

      - uses: amannn/action-semantic-pull-request@v6.1.2
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            test
            ci
            perf
            build
            revert
