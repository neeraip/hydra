name: Licence Notices

# The notices the app shows under Settings → About are generated from the
# GUI's own dependency graph, so they go stale the moment a dependency moves
# and nothing about the change looks wrong. `just ci` has always checked
# them; CI did not, which meant the check only ran when somebody happened to
# run the full gate locally. Dependency bumps arrive continuously and merge
# unattended, so in practice the file drifted between releases and was swept
# up by hand — a notice that names a version the binary does not contain has
# not travelled with the binary, which is the whole point of shipping it.
#
# A bump that changes what the app links will fail this. The fix is
# `just licenses` and committing the result, which is a real part of the
# change rather than an afterthought.
#
# Dependabot cannot run that command, so every bump of a shipped dependency
# arrived incomplete and failed here — which is how gui-v2.19.0 came to ship
# notices that do not match its dependencies. On a Dependabot pull request
# this job therefore regenerates the file and pushes it onto the branch
# instead of failing, so the bump completes itself.
#
# That push needs a token whose pushes re-trigger CI: GITHUB_TOKEN's do not,
# so the branch would land a new head commit with no check runs and auto-merge
# would wait forever. Store a fine-grained PAT with `contents: write` on this
# repository as the Dependabot secret LICENSES_BOT_TOKEN (Settings → Secrets
# and variables → Dependabot). Without it this job fails exactly as it does
# today and says what to do, so nothing is worse than before it existed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly safety net: catch toolchain/registry drift during push-quiet weeks.
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: licenses-ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only. On main a cancelled run destroys the
  # verdict for that commit: the sweep in 1941d116 was caught here and then
  # cancelled 31 seconds later by the next push, so a broken release build was
  # the first thing to notice it. cargo-ci.yml guards this the same way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  # For the recreate-note comment below; Dependabot-triggered runs get a
  # read-only GITHUB_TOKEN unless the scope is granted here explicitly.
  pull-requests: write

jobs:
  notices:
    name: Licence Notices
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          # The branch, not the merge ref, so a regenerated file can be
          # pushed back onto the pull request.
          ref: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.head_ref || '' }}
          token: ${{ secrets.LICENSES_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      # The script walks both dependency graphs and reads the licence text
      # out of each package, so both toolchains and both sets of fetched
      # dependencies have to be present — this is the one check that spans
      # the two ecosystems, which is why it is its own workflow.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `cargo metadata` is read unfiltered, so the registry must hold every
      # platform's dependencies, not just this runner's.
      - name: Fetch Cargo dependencies
        run: cargo fetch --locked

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: crates/gui/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        # --ignore-scripts: the generator reads package metadata and licence
        # text, so no lifecycle script needs to run, and this job holds a
        # token that can write to the repository.
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: crates/gui/frontend

      - name: Check the notices match the dependencies
        id: check
        # A Dependabot bump is expected to move these, and the step below
        # completes it. Every other pull request fails here.
        continue-on-error: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        run: python3 scripts/licenses.py --check

      - name: Complete the bump with regenerated notices
        if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && steps.check.outcome == 'failure' }}
        env:
          HAS_TOKEN: ${{ secrets.LICENSES_BOT_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::The notices are out of date and no LICENSES_BOT_TOKEN is set, so they cannot be pushed. Run 'just licenses' and commit the result, or add the token (see this workflow's header)."
            exit 1
          fi
          python3 scripts/licenses.py
          if git diff --quiet -- crates/gui/resources/third-party-licenses.json; then
            echo "::error::--check reported drift but regenerating changed nothing. The generator may be non-deterministic on this runner."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/gui/resources/third-party-licenses.json
          git commit -m "chore(gui): regenerate third-party licenses for this bump"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "Pushed regenerated notices onto ${GITHUB_HEAD_REF}." >> "$GITHUB_STEP_SUMMARY"

      # Dependabot refuses to rebase a branch holding a commit it did not
      # author, so the push above trades `@dependabot rebase` away. Say so
      # on the pull request, once, with the command that still works —
      # otherwise the trade is discovered from Dependabot's refusal, PRs
      # deep into a conflict.
      - name: Note the recreate command on the pull request
        if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && steps.check.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- licenses-ci-recreate-note -->"
          if gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq '.[].body' | grep -qF "$marker"; then
            exit 0
          fi
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "$marker
          This branch now carries a CI commit (regenerated licence notices), so Dependabot will refuse \`@dependabot rebase\` from here on. Use \`@dependabot recreate\` instead — it rebuilds the pull request from scratch, and this workflow re-completes the notices on the new head."
