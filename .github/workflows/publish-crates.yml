name: Publish Crates

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'cli-v')

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.26.2

      - name: Install cargo-release
        run: cargo binstall cargo-release --version "=1.1.2" --no-confirm

      - name: Publish library crates (v* tag)
        if: startsWith(github.ref_name, 'v')
        run: cargo release publish -p hydra-common -p hydra-engine-wds -p hydra-engine-uds -p hydra-interop-swmm -p hydra-interop-epanet -p hydra-engines -p hydra-report -p hydra-sdk --execute --no-confirm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Each track has its own release PR, so a CLI release can be published
      # while the library version it pins is still on its way to crates.io
      # (or not yet released at all). Publishing then would fail on an
      # unindexed dependency, so wait for it, and stop with a clear message
      # if it never arrives.
      - name: Wait for the pinned hydra-sdk on crates.io (cli-v* tag)
        if: startsWith(github.ref_name, 'cli-v')
        run: |
          pin=$(grep -oE 'package = "hydra-sdk"[^}]*version = "[0-9]+\.[0-9]+\.[0-9]+"' crates/cli/Cargo.toml \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1 || true)
          if [ -z "$pin" ]; then
            echo "::error::Could not read the hydra-sdk version pin from crates/cli/Cargo.toml."
            exit 1
          fi
          for attempt in $(seq 1 40); do
            if curl -fsS -A "hydra-release (github.com/neeraip/hydra)" \
                "https://crates.io/api/v1/crates/hydra-sdk/${pin}" >/dev/null; then
              echo "hydra-sdk ${pin} is on crates.io."
              exit 0
            fi
            echo "hydra-sdk ${pin} not on crates.io yet (attempt ${attempt}/40)."
            sleep 45
          done
          echo "::error::hydra-sdk ${pin} never appeared on crates.io. Publish the library release that carries it first, then re-run this job."
          exit 1

      - name: Publish CLI crate (cli-v* tag)
        if: startsWith(github.ref_name, 'cli-v')
        run: cargo release publish -p hydra-cli --execute --no-confirm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
