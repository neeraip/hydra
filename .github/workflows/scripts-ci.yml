name: Scripts CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly safety net: catch toolchain/registry drift during push-quiet weeks.
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: scripts-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Scripts Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Python script tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
