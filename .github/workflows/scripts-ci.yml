name: Scripts CI

# Always runs on pull requests and in the merge queue: it is fast, and the
# tests read files from all over the repository (manifests, workflows, docs),
# so no path could safely skip it. Not on push to main: the merge queue
# already tested that exact commit.
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  # Weekly safety net: catch toolchain/registry drift during push-quiet weeks.
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: scripts-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Scripts Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The only third-party import in the suite. `test_release_rehearsal`
      # compares two workflow files structurally, and skips itself without
      # this — a skip nobody would notice, on the test that keeps the release
      # rehearsal honest.
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Install just and actionlint
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just,actionlint@1.7.12

      - name: Run Python script tests (just test-scripts)
        run: just test-scripts

      # `just lint` runs this, but until here no workflow did, so an em dash
      # in user-facing copy could merge green. It reads the whole tree, like
      # the tests above, so it belongs in the job no path skips.
      - name: No em dashes in user-facing copy (just em-dashes)
        run: just em-dashes

      - name: Lint the workflows (just lint-workflows)
        run: just lint-workflows
