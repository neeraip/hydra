name: Scripts CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly safety net: catch toolchain/registry drift during push-quiet weeks.
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: scripts-ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only. On main a cancelled run destroys the
  # verdict for that commit: the sweep in 1941d116 was caught here and then
  # cancelled 31 seconds later by the next push, so a broken release build was
  # the first thing to notice it. cargo-ci.yml guards this the same way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Scripts Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The only third-party import in the suite. `test_release_rehearsal`
      # compares two workflow files structurally, and skips itself without
      # this — a skip nobody would notice, on the test that keeps the release
      # rehearsal honest.
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Run Python script tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
