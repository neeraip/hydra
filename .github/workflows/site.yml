# The whole GitHub Pages site: the marketing page at /, the mdbook docs at
# /docs, and the browser demo at /try.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'crates/wasm/**'
      - 'scripts/build-wasm-single.py'
      - '.github/workflows/site.yml'
  # Engine changes alter what /try computes but do not trigger a deploy —
  # redeploying the demo on every solver commit would rebuild Pages far more
  # often than it informs anyone. Dispatch manually after an engine release
  # worth showing off.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # The wasm release build is the long pole (fat LTO on the engines).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install mdBook and wasm-pack
        run: cargo binstall mdbook wasm-pack --no-confirm

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Build docs
        run: mdbook build docs

      # The browser demo, deployed at /try. Everything runs client-side —
      # a model opened there is read, solved and reported in the visitor's
      # own tab, and never leaves it.
      - name: Build the browser demo
        run: |
          wasm-pack build crates/wasm --target web --out-dir www/pkg --out-name hydra
          wasm-pack build crates/wasm --target no-modules --out-dir www/pkg-nomodules --out-name hydra
          python3 scripts/build-wasm-single.py

      # The marketing page at /, the book at /docs, the demo at /try.
      # `just site` assembles the identical layout locally — keep the two
      # in agreement. The no-modules bundle exists only to assemble
      # hydra.html and does not ship; hydra.html itself does, as the
      # offline download the demo page offers.
      - name: Assemble the site (just site)
        run: |
          mkdir -p _site/try
          cp -R site/. _site/
          cp -R docs/book _site/docs
          cp crates/wasm/www/index.html crates/wasm/www/app.js crates/wasm/www/app.css \
             crates/wasm/www/hydra.html _site/try/
          cp -R crates/wasm/www/pkg _site/try/pkg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
