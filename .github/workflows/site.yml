# The whole GitHub Pages site: the marketing page at /, the mdbook docs at
# /docs, and the browser demo at /try.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'crates/demo/**'
      - 'scripts/build-wasm-single.py'
      - '.github/workflows/site.yml'
  # Engine changes alter what /try computes but do not trigger a deploy —
  # redeploying the demo on every solver commit would rebuild Pages far more
  # often than it informs anyone. Dispatch manually after an engine release
  # worth showing off.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # The wasm release build is the long pole (fat LTO on the engines).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      # mdBook is pinned: docs/theme/index.hbs and docs/hydra-book.css are
      # written against this version's template and variables. Bump the pin
      # and re-diff the theme override together.
      - name: Install mdBook and wasm-pack
        run: cargo binstall mdbook@0.5.4 wasm-pack --no-confirm

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Build docs
        run: |
          cp site/hydra-theme.css docs/hydra-theme.css
          mdbook build docs

      # The browser demo, deployed at /try. Everything runs client-side —
      # a model opened there is read, solved and reported in the visitor's
      # own tab, and never leaves it. (The offline single-file build is a
      # release asset, not part of the site; draft-release.yml builds it.)
      - name: Build the browser demo
        run: wasm-pack build crates/demo --target web --out-dir www/pkg --out-name hydra

      # The marketing page at /, the book at /docs, the demo at /try —
      # every surface carrying site/hydra-theme.css, the shared skin.
      # `just site` assembles the identical layout locally — keep the two
      # in agreement.
      - name: Assemble the site (just site)
        run: |
          mkdir -p _site/try
          cp -R site/. _site/
          cp -R docs/book _site/docs
          cp crates/demo/www/index.html crates/demo/www/app.js crates/demo/www/app.css \
             site/hydra-theme.css _site/try/
          cp -R crates/demo/www/pkg _site/try/pkg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
