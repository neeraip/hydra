# The whole GitHub Pages site: the marketing page at /, the mdbook docs at
# /docs, and the browser demo at /try.
#
# Two cadences share this deploy. The marketing page and the docs are
# content: they build from main and ship on push, because a typo fix or a
# doc update should not wait on a release. The demo is product: /try is
# built wholesale (page, theme, and wasm together, so nothing skews) from
# the latest library release tag, and a published library release
# redeploys the site so /try updates itself the moment the release is
# real. Demo work on main therefore stays invisible on /try until it is
# released, which is the point: visitors try released engines.
#
# A release run executes on the tag ref, so the github-pages environment
# needs a deployment policy for tags matching `v*` alongside the one for
# `main`. That policy lives in repository settings, not here; without it the
# Deploy job is rejected before its first step with no log to explain why.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/site.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # CLI and GUI releases publish through the same event but change
    # nothing on the site; only library tags (v*) rebuild /try.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    # The wasm release build is the long pole (fat LTO on the engines).
    timeout-minutes: 25

    steps:
      # Full history so the latest library tag is resolvable.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the released demo source
        id: release
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          test -n "$tag" || { echo "no library release tag found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "/try builds from $tag"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      # mdBook is pinned: docs/theme/index.hbs and docs/hydra-book.css are
      # written against this version's template and variables. Bump the pin
      # and re-diff the theme override together.
      - name: Install mdBook and wasm-pack
        run: cargo binstall mdbook@0.5.4 mdbook-katex@0.10.0 wasm-pack --no-confirm

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Build docs
        run: |
          cp site/hydra-theme.css docs/hydra-theme.css
          mdbook build docs

      # The browser demo, deployed at /try, from the release checkout.
      # Everything runs client-side — a model opened there is read, solved
      # and reported in the visitor's own tab, and never leaves it. (The
      # offline single-file build is a release asset, not part of the
      # site; draft-release.yml builds it.) The crate was named
      # hydra-wasm before v13, hence the directory probe.
      - name: Build the browser demo at the release tag
        run: |
          demo="release/crates/demo"
          test -d "$demo" || demo="release/crates/wasm"
          echo "demo crate: $demo"
          wasm-pack build "$demo" --target web --out-dir www/pkg --out-name hydra

      # The marketing page at /, the book at /docs, the demo at /try. The
      # demo's page files come from the release checkout too, so its
      # markup, theme, and wasm can never skew apart. `just site`
      # assembles the same layout from the working tree for local
      # preview; only the /try provenance differs.
      - name: Assemble the site
        run: |
          demo="release/crates/demo"
          test -d "$demo" || demo="release/crates/wasm"
          mkdir -p _site/try
          cp -R site/. _site/
          cp -R docs/book _site/docs
          cp "$demo/www/index.html" "$demo/www/app.js" "$demo/www/app.css" _site/try/
          if [ -f release/site/hydra-theme.css ]; then
            cp release/site/hydra-theme.css _site/try/
          fi
          cp -R "$demo/www/pkg" _site/try/pkg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
