# Publishes the Tauri updater manifest (latest.json) consumed by installed
# GUI apps (tauri-plugin-updater). Runs when a GUI release is PUBLISHED —
# not on tag push — so the manifest can never point at draft assets, which
# are not publicly downloadable. The manifest lives on the dedicated
# `updater-manifest` branch, giving the plugin a stable endpoint URL:
#
#   https://raw.githubusercontent.com/neeraip/hydra/updater-manifest/latest.json
#
# Why a branch and not a release asset: this repo has IMMUTABLE RELEASES
# enabled — a published release's assets are frozen forever, AND a deleted
# immutable release permanently tombstones its tag name ("tag_name was used
# by an immutable release"), so no fixed release tag can ever host a
# replaceable manifest. (The `updater` tag was burned learning this; shipped
# gui-v2.2.0 binaries point at that dead endpoint and cannot self-update.)
# The GitHub "/releases/latest" endpoint is equally unusable because this
# repo interleaves Library (v*), CLI (cli-v*), and GUI (gui-v*) releases.
name: Updater Manifest

on:
  release:
    types: [published]
  # Manual recovery/testing: rebuild the manifest from any published GUI
  # release without republishing it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Published GUI release tag (gui-vX.Y.Z) to build the manifest from"
        required: true
        type: string

permissions:
  contents: write

# Serialise manifest updates; never cancel one mid-write.
concurrency:
  group: updater-manifest
  cancel-in-progress: false

jobs:
  publish-manifest:
    name: Publish latest.json
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'gui-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Build manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            gui-v*) ;;
            *) echo "Not a GUI release tag: ${TAG}"; exit 1 ;;
          esac

          # Source release metadata from the API (uniform across the
          # release-published and manual-dispatch triggers). Drafts have no
          # public asset URLs — refuse them.
          release_info="$(gh release view "${TAG}" --repo "${REPO}" --json url,publishedAt,isDraft)"
          if [ "$(echo "${release_info}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["isDraft"])')" = "True" ]; then
            echo "Release ${TAG} is still a draft — publish it first."
            exit 1
          fi
          HTML_URL="$(echo "${release_info}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')"
          PUB_DATE="$(echo "${release_info}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["publishedAt"])')"
          export HTML_URL PUB_DATE

          # Work outside the repo tree — the next step switches branches.
          cd "${RUNNER_TEMP}"

          # Signatures are tiny detached files — pull them all.
          mkdir -p sigs && gh release download "${TAG}" --repo "${REPO}" \
            --pattern '*.sig' --dir sigs || true

          # Current manifest (absent until the branch first exists).
          cd "${GITHUB_WORKSPACE}"
          if git fetch origin updater-manifest 2>/dev/null; then
            git show FETCH_HEAD:latest.json > "${RUNNER_TEMP}/current.json" || true
          fi
          cd "${RUNNER_TEMP}"

          python3 << 'EOF'
          import json, os, sys

          repo     = os.environ['REPO']
          tag      = os.environ['TAG']
          version  = os.environ['TAG'].removeprefix('gui-v')

          # Never move the manifest backwards: publishing an old release
          # (or re-publishing) must not downgrade every installed app's
          # update target.
          def semver(v):
              return tuple(int(''.join(c for c in part if c.isdigit()) or 0)
                           for part in v.split('.'))
          try:
              with open('current.json') as f:
                  current = json.load(f)
              if semver(current.get('version', '0.0.0')) >= semver(version):
                  print(f"Manifest already at {current['version']} >= {version}; skipping.")
                  sys.exit(0)
          except FileNotFoundError:
              pass

          # target triple (in asset filenames) → updater platform key,
          # with the updater-consumable artifact extension per platform.
          PLATFORMS = {
              'darwin-aarch64':  ('aarch64-apple-darwin',      '.app.tar.gz'),
              'darwin-x86_64':   ('x86_64-apple-darwin',       '.app.tar.gz'),
              'windows-x86_64':  ('x86_64-pc-windows-msvc',    '.exe'),
              'linux-x86_64':    ('x86_64-unknown-linux-gnu',  '.AppImage'),
              'linux-aarch64':   ('aarch64-unknown-linux-gnu', '.AppImage'),
          }

          platforms = {}
          for key, (triple, ext) in PLATFORMS.items():
              asset = f'hydra-gui-{version}-{triple}{ext}'
              sig_path = os.path.join('sigs', asset + '.sig')
              if not os.path.exists(sig_path):
                  continue
              with open(sig_path) as f:
                  signature = f.read().strip()
              platforms[key] = {
                  'signature': signature,
                  'url': f'https://github.com/{repo}/releases/download/{tag}/{asset}',
              }

          if not platforms:
              print('No signed updater artifacts found on the release — '
                    'is TAURI_SIGNING_PRIVATE_KEY configured?')
              sys.exit(1)

          manifest = {
              'version': version,
              'notes': f"Hydra GUI {version} — release notes: {os.environ['HTML_URL']}",
              'pub_date': os.environ['PUB_DATE'],
              'platforms': platforms,
          }
          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f'Manifest for {version}: {", ".join(sorted(platforms))}')
          EOF

      - name: Push to updater-manifest branch
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # A guard exit above leaves no manifest to publish.
          [ -f "${RUNNER_TEMP}/latest.json" ] || { echo "Nothing to publish."; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Continue the branch's history when it exists; otherwise start an
          # orphan branch holding only the manifest.
          if git fetch origin updater-manifest 2>/dev/null; then
            git checkout -B updater-manifest FETCH_HEAD
          else
            git checkout --orphan updater-manifest
            git rm -rfq . || true
          fi

          cp "${RUNNER_TEMP}/latest.json" latest.json
          git add latest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged."
            exit 0
          fi
          git commit -m "updater manifest for ${TAG}"
          git push origin updater-manifest
