name: Cargo Audit

# Not run per-PR: cargo-deny in Cargo CI's lint job already checks the same
# advisory database (plus licenses/bans/sources) on every pull request.
on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: cargo-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.22.0

      - name: Install cargo-audit
        run: cargo binstall cargo-audit --no-confirm

      - name: Audit dependencies
        run: cargo audit
