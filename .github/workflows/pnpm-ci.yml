name: PNPM CI

# Runs on pull requests and in the merge queue, when the change needs it
# (scripts/ci_changes.py), and weekly. Not on push to main: the merge queue
# already tested that exact commit, and nothing here warms a cache other
# runs share (the weekly run on main saves the pnpm store).
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  # Weekly safety net: catch toolchain/registry drift during push-quiet weeks.
  schedule:
    - cron: "15 6 * * 1"

concurrency:
  group: pnpm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Decide which checks run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci_changes.py
            .github/actions/ci-changes
          sparse-checkout-cone-mode: false
      - id: decide
        uses: ./.github/actions/ci-changes

  # Both jobs below skip when the change needs no frontend checks; a skipped
  # job satisfies a required check. `!cancelled()` with `!= 'false'` fails
  # safe: if the decision job fails, its output is empty and they run.

  # Static checks + supply chain, mirroring Cargo Lint (which carries
  # cargo-deny): the standalone PNPM Audit workflow only runs on a schedule
  # for time-based advisories.
  lint:
    name: PNPM Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: crates/gui/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: crates/gui/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Regenerate CRS catalog
        working-directory: ${{ github.workspace }}
        run: node scripts/update-crs-catalog.mjs

      - name: Check CRS catalog is up to date
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- crates/gui/resources/crs-catalog.json

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  test:
    name: PNPM Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: crates/gui/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: crates/gui/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # The layout tests drive a real browser: jsdom performs no layout, so
      # a whole class of regression — a box that sizes to its content, a row
      # too short for its own second line — is invisible without one.
      - name: Install Chromium for the layout tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run layout tests
        run: pnpm test:layout
