name: PNPM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly safety net: catch toolchain/registry drift during push-quiet weeks.
  schedule:
    - cron: "15 6 * * 1"

concurrency:
  group: pnpm-ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only. On main a cancelled run destroys the
  # verdict for that commit: the sweep in 1941d116 was caught here and then
  # cancelled 31 seconds later by the next push, so a broken release build was
  # the first thing to notice it. cargo-ci.yml guards this the same way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Static checks + supply chain, mirroring Cargo Lint (which carries
  # cargo-deny): the standalone PNPM Audit workflow only runs on a schedule
  # for time-based advisories.
  lint:
    name: PNPM Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: crates/gui/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: crates/gui/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Regenerate CRS catalog
        working-directory: ${{ github.workspace }}
        run: node scripts/update-crs-catalog.mjs

      - name: Check CRS catalog is up to date
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- crates/gui/resources/crs-catalog.json

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  test:
    name: PNPM Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: crates/gui/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: crates/gui/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # The layout tests drive a real browser: jsdom performs no layout, so
      # a whole class of regression — a box that sizes to its content, a row
      # too short for its own second line — is invisible without one.
      - name: Install Chromium for the layout tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run layout tests
        run: pnpm test:layout
