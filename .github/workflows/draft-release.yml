name: Draft Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'cli-v[0-9]+.[0-9]+.[0-9]+'
      - 'gui-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

# Never cancel a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── 1. Create an empty draft release to collect assets into. ─────────────
  prepare-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_name }}" == cli-v* ]]; then
            title="Hydra CLI ${GITHUB_REF_NAME#cli-}"
          elif [[ "${{ github.ref_name }}" == gui-v* ]]; then
            title="Hydra GUI ${GITHUB_REF_NAME#gui-}"
          else
            title="Hydra Library ${GITHUB_REF_NAME}"
          fi
          gh release create "${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            --title "${title}"

  # ── 2. Build the CLI binary for each target and attach it. ───────────────
  cli:
    name: CLI / ${{ matrix.target }}
    needs: prepare-release
    if: startsWith(github.ref_name, 'cli-v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,  cross: false }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest,  cross: true  }
          - { target: x86_64-pc-windows-msvc,   runner: windows-latest, cross: false }
          # - { target: x86_64-apple-darwin, runner: macos-13, cross: false }  # macos-13 runner unavailable
          - { target: aarch64-apple-darwin,      runner: macos-latest,   cross: false }

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          # Release runs execute on tag refs. Caches saved under a tag ref can
          # never be restored by any later run (each release is a new tag), so
          # they were pure eviction pressure on the 10 GB budget — ~4 GB per
          # release — pushing out the main-branch caches CI depends on.
          # Restore from main's caches; never save.
          save-if: false

      - uses: cargo-bins/cargo-binstall@v1.21.1
        if: matrix.cross

      - name: Install cross
        if: matrix.cross
        run: cargo binstall cross --no-confirm

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked -p hydra-cli --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked -p hydra-cli --target ${{ matrix.target }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          bin="target/${{ matrix.target }}/release/hydra"
          archive="hydra-cli-${version}-${{ matrix.target }}.tar.gz"
          tar -czf "${archive}" -C "$(dirname "${bin}")" "$(basename "${bin}")"
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^cli-v', ''
          $archive = "hydra-cli-${version}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/hydra.exe" -DestinationPath $archive
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retried for the reason the GUI upload step sets out: a draft
          # release resolves only through a paginated listing, and this
          # matrix uploads to it from four targets at once. `--clobber`
          # is what makes a retry safe — without it, retrying an upload
          # that actually succeeded fails on the existing asset.
          for attempt in 1 2 3 4 5; do
            gh release upload "${{ github.ref_name }}" "${{ env.ARCHIVE }}" --clobber && exit 0
            if [ "$attempt" = 5 ]; then
              echo "gh release upload failed after 5 attempts" >&2
              exit 1
            fi
            sleep $(( 2 ** (attempt - 1) ))
          done

  # ── Library: attach the browser demo as a single portable HTML file. ──────
  #
  # A library tag otherwise carries no assets — the release is the crates.io
  # publish. hydra-try-<version>.html is the library in runnable form: the
  # engines at exactly the tagged version, no install, runs from file://.
  # Pinned here because /try on Pages is a rolling deploy; a support
  # conversation ("open this file and send me the report") needs the
  # immutable copy whose report header names the release under discussion.
  #
  # The assembler is deterministic by construction (gzip mtime pinned), so a
  # re-run of this job produces the byte-identical asset.
  wasm:
    name: Browser demo
    needs: prepare-release
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: wasm32-unknown-unknown
          cache: false

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          # Same policy as the CLI job above: restore from main, never save
          # under a tag ref nothing can restore from.
          save-if: false

      - uses: cargo-bins/cargo-binstall@v1.21.1

      # Same guard as cargo-ci: a restored cache can carry binstall's install
      # manifest without the binary, and binstall trusts the manifest. Trust
      # the PATH, and force past the manifest when the binary is missing.
      - name: Install wasm-pack
        run: command -v wasm-pack || cargo binstall wasm-pack --no-confirm --force

      # Only the no-modules bundle: it is all the single-file assembler
      # consumes. The ES-module build is the /try deploy's concern.
      - name: Build the single-file page
        run: |
          wasm-pack build crates/demo --target no-modules --out-dir www/pkg-nomodules --out-name hydra
          python3 scripts/build-wasm-single.py

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="hydra-try-${version}.html"
          cp crates/demo/www/hydra.html "${asset}"
          # Retried like the others: this job races nothing, but a draft
          # lookup or a plain 5xx should not cost the release its demo.
          for attempt in 1 2 3 4 5; do
            gh release upload "${{ github.ref_name }}" "${asset}" --clobber && exit 0
            if [ "$attempt" = 5 ]; then
              echo "gh release upload failed after 5 attempts" >&2
              exit 1
            fi
            sleep $(( 2 ** (attempt - 1) ))
          done

  # ── 3. Build the Tauri desktop app and attach platform installers. ────────
  gui:
    name: GUI / ${{ matrix.platform }}
    needs: prepare-release
    if: startsWith(github.ref_name, 'gui-v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # - { platform: macOS-x86_64, runner: macos-13, target: x86_64-apple-darwin }  # macos-13 runner unavailable
          - { platform: macOS-aarch64,  runner: macos-latest,   target: aarch64-apple-darwin     }
          - { platform: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc  }
          - { platform: linux-x86_64,   runner: ubuntu-22.04,   target: x86_64-unknown-linux-gnu }

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Tauri system dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # actions/setup-node's `cache` input is a string enum (npm/yarn/pnpm),
          # not a boolean — unlike setup-rust-toolchain's `cache` below. Its
          # built-in pnpm caching is also unreliable on the Windows runner in
          # this matrix ("Path Validation Error" on the post-job cache-save,
          # even though the build itself succeeds). Release builds run rarely,
          # so just omit `cache` entirely rather than chase a flaky
          # Windows-specific cache-path resolution bug.

      - name: Install frontend dependencies
        working-directory: crates/gui/frontend
        run: pnpm install --frozen-lockfile

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          # Release runs execute on tag refs. Caches saved under a tag ref can
          # never be restored by any later run (each release is a new tag), so
          # they were pure eviction pressure on the 10 GB budget — ~4 GB per
          # release — pushing out the main-branch caches CI depends on.
          # Restore from main's caches; never save.
          save-if: false

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.11.4-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo binstall tauri-cli --version "=2.11.4" --no-confirm

      - name: Regenerate CRS catalog
        run: node scripts/update-crs-catalog.mjs

      - name: Build GUI installer
        id: tauri
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater (minisign-style) signing — separate from Apple code
          # signing. Produces the .sig files the installed app verifies
          # before applying an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/gui
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }}

      - name: Rename and upload GUI artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 << 'EOF'
          import json, os, shutil, subprocess, time

          paths = json.loads(os.environ['ARTIFACT_PATHS'])
          tag    = os.environ['TAG']
          target = os.environ['TARGET']
          version = tag.removeprefix('gui-v')

          # Updater bundles (createUpdaterArtifacts: true, v2 format) ship
          # alongside the installers: macOS .app.tar.gz, plus a detached
          # .sig for every updater-consumable artifact. The v1-compat forms
          # (.nsis.zip / .AppImage.tar.gz) are not produced — skip
          # defensively if they ever appear.
          def classify(path):
              if path.endswith('.AppImage.tar.gz'):     return None  # v1-compat — not produced
              if path.endswith('.AppImage.tar.gz.sig'): return None
              if path.endswith('.nsis.zip'):            return None
              if path.endswith('.nsis.zip.sig'):        return None
              exts = ('.app.tar.gz', '.AppImage', '.dmg', '.exe', '.msi', '.deb', '.rpm')
              for ext in exts:
                  if path.endswith(ext):
                      return ext
                  if path.endswith(ext + '.sig'):
                      return ext + '.sig'
              return None

          uploads = []
          for src in paths:
              ext = classify(src)
              if ext is None:
                  print(f'Skipping: {os.path.basename(src)}', flush=True)
                  continue
              dst_name = f'hydra-gui-{version}-{target}{ext}'
              dst = os.path.join(os.path.dirname(src), dst_name)
              shutil.copy2(src, dst)
              uploads.append(dst)

          if not uploads:
              raise SystemExit(f'no uploadable artifacts among: {paths}')

          # One call for every artifact, and retried.
          #
          # A draft release cannot be fetched by tag — GitHub's by-tag
          # endpoint serves published releases only — so `gh` finds it by
          # paging the release list, and that listing is eventually
          # consistent. Three platform jobs uploading at once, six
          # artifacts each, one lookup per artifact, and `--clobber`
          # deleting before it writes, was enough for a lookup to come back
          # empty: 2.16.0 lost its .rpm and .AppImage to a "release not
          # found" on the third of six uploads, after the first two had
          # gone up.
          #
          # Uploading in one call takes that from six lookups per platform
          # to one. The retry covers the rest, and covers a plain 5xx too.
          for attempt in range(5):
              result = subprocess.run(['gh', 'release', 'upload', tag, *uploads, '--clobber'])
              if result.returncode == 0:
                  break
              if attempt == 4:
                  raise SystemExit(f'gh release upload failed after 5 attempts')
              delay = 2 ** attempt
              print(f'Upload failed; retrying in {delay}s', flush=True)
              time.sleep(delay)

          for dst in uploads:
              print(f'Uploaded: {os.path.basename(dst)}', flush=True)
          EOF
