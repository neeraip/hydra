name: PNPM Audit

on:
  pull_request:
  workflow_dispatch:
  # Weekly safety net: catch toolchain/registry drift during push-quiet weeks.
  schedule:
    - cron: "45 6 * * 1"

concurrency:
  group: pnpm-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: PNPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: crates/gui/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: crates/gui/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
