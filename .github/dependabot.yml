version: 2

# Bumps are grouped per ecosystem (minors and patches together, majors
# individual): one grouped PR per ecosystem per week costs one CI run
# instead of N. Majors stay individual so a breaking bump never blocks the
# routine ones riding with it; they need human review either way, and the
# auto-merge workflow already excludes them.
#
# Nothing pushes onto these branches. The licence notices a bump moves are
# regenerated on the next release PR instead (release.yml), so Dependabot
# keeps full control of its PRs: it rebases them and closes superseded ones.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /crates/gui/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
