# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Only check the default feature set for each crate.
all-features = false

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
# Deny crates with known security vulnerabilities.
version = 2
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # quick-xml 0.38 DoS advisories (quadratic attribute checking; unbounded
    # namespace allocation). Patched in 0.39+, but every dependent pins ^0.38
    # (zbus D-Bus stack via tauri on Linux, rstest proc-macros dev-only,
    # citationberg/hayagriva via typst-library) so the lockfile cannot move
    # until upstreams release. Exposure: none of these paths parse
    # attacker-controlled XML in Hydra (local D-Bus introspection data, CSL
    # citation styles we never load, dev-time macros), and both advisories
    # are denial-of-service class. Remove once dependents adopt quick-xml
    # >= 0.39.
    { id = "RUSTSEC-2026-0194", reason = "DoS-only; no untrusted XML reaches quick-xml 0.38 dependents; awaiting upstream bumps" },
    { id = "RUSTSEC-2026-0195", reason = "DoS-only; no untrusted XML reaches quick-xml 0.38 dependents; awaiting upstream bumps" },
]

# ── Licences ──────────────────────────────────────────────────────────────────
[licenses]
version = 2
# Confidence threshold for licence detection (0.0 – 1.0).
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0-only",
    "CDLA-Permissive-2.0",
]

# ── Banned crates ─────────────────────────────────────────────────────────────
[bans]
# Warn on duplicate versions of the same crate. Kept at "warn" deliberately:
# the Tauri/wry dependency tree (GUI) drags in ~47 duplicated crates
# (windows-sys, zbus, phf, toml, …) that we cannot deduplicate ourselves, so
# "deny" would only produce permanent unfixable failures.
multiple-versions = "warn"
wildcards = "allow"
deny = []

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Only allow crates published to crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
