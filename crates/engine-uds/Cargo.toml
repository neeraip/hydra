[package]
name = "hydra-engine-uds"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Hydra urban drainage engine — runoff, dynamic-wave routing, and water quality on the SWMM data model"
readme = "README.md"
keywords = ["water", "hydraulics", "simulation", "engine"]
categories = ["science", "simulation"]

[dependencies]
hydra-common = { path = "../common", version = "15.0.0" }
serde_json = "1"

[features]
# Parallel channel phase (spec 6.4) on an in-house persistent spin team,
# width from the model's THREADS option. Byte-identical results at any
# width; never enabled for wasm builds. No dependencies: the team is
# hydraulics/team.rs.
threads = []

[dev-dependencies]
# Deliberate dev-only cycle: the engine's behavioural tests open models
# from .inp text, which is the dialect crate's job (format-blind
# extraction). Dev-dependencies may be cyclic; the published library
# depends on nothing here.
hydra-interop-swmm = { path = "../interop-swmm" }
