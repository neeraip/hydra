[package]
name = "hydra-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Water distribution network simulator — EPANET-compatible extended-period simulation"
readme = "README.md"
keywords = ["epanet", "water", "hydraulics", "simulation", "network"]
categories = ["science", "simulation"]
publish = true

[dependencies]
hydra-common = { path = "../common", version = "4.0.1" }
hydra-engine-wds = { path = "../engine-wds", version = "4.0.1" }
hydra-report = { path = "../report", version = "4.0.1" }

[features]
# Enables the PDF renderer in hydra::report (heavyweight: embeds Typst).
report-pdf = ["hydra-report/pdf"]
