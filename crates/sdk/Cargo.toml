[package]
name = "hydra-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Water infrastructure simulation — EPANET-compatible water distribution and SWMM-compatible urban drainage simulation"
readme = "README.md"
keywords = ["epanet", "water", "hydraulics", "simulation", "network"]
categories = ["science", "simulation"]
publish = true

[dependencies]
hydra-common = { path = "../common", version = "14.0.0" }
hydra-engine-uds = { path = "../engine-uds", version = "14.0.0" }
hydra-interop-swmm = { path = "../interop-swmm", version = "14.0.0" }
hydra-interop-epanet = { path = "../interop-epanet", version = "14.0.0" }
hydra-engine-wds = { path = "../engine-wds", version = "14.0.0" }
hydra-engines = { path = "../engines", version = "14.0.0" }
hydra-report = { path = "../report", version = "14.0.0" }

[features]
# Enables the PDF renderer in hydra::report (heavyweight: embeds Typst).
report-pdf = ["hydra-report/pdf"]
# Parallel drainage routing (uds specs 6.4 and 11.2) on an in-house
# persistent spin team: the whole trial iteration and the statistics
# pass, width from the model's THREADS option; byte-identical results
# at any width. Opt-in and native only (never enable for wasm
# targets). The official apps enable it: models that never ask for
# width still run the serial arm, bit for bit, and the compiled-in
# feature costs them ~2% (fat-LTO inline displacement, driven down
# from ~8% by pinning the displaced callees and boxing the pool),
# while a model whose THREADS asks for width runs 45%+ faster.
threads = ["hydra-engine-uds/threads"]
