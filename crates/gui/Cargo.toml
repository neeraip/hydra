[package]
name = "hydra-gui"
version = "2.19.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Hydra GUI — desktop application"

[[bin]]
name = "hydra-gui"
path = "src/main.rs"

[features]
# Selects embedded production assets instead of the dev-server URL: tauri
# sets `dev = !custom-protocol` at compile time, so a release binary built
# WITHOUT this feature renders a white window trying to load devUrl.
# `cargo tauri build` enables it automatically; `just release` passes it
# explicitly. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
hydra = { package = "hydra-sdk", path = "../sdk", features = ["report-pdf"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
tracing-appender = "0.2.5"
# Archive import (already in the lockfile via tauri-plugin-updater; the
# minimal feature set reads the deflate and stored entries ordinary tools
# produce).
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.9"
sevenz-rust2 = { version = "0.21.4", default-features = false, features = ["compress", "util"] }

[dev-dependencies]
tempfile = "3"
