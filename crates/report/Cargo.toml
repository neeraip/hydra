[package]
name = "hydra-report"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Hydra report generation — templates, document assembly, and txt/csv/html renderers over engine-neutral content fragments"
readme = "README.md"
keywords = ["water", "hydraulics", "simulation", "report"]
categories = ["science", "simulation"]

[features]
# PDF rendering embeds the Typst typesetting engine and fonts — a
# heavyweight dependency the text formats never pay for (spec §4.5).
pdf = ["dep:typst", "dep:typst-pdf", "dep:typst-assets", "dep:typst-layout"]

[dependencies]
hydra-common = { path = "../common", version = "6.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-assets = { version = "0.15", features = ["fonts"], optional = true }
